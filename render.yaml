# Prepared configuration only; no service has been published.
services:
  - type: web
    name: aegislab
    runtime: python
    buildCommand: uv sync --locked --no-dev
    startCommand: uv run --locked --no-dev uvicorn aegislab.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/ready
    envVars:
      - key: UV_VERSION
        value: 0.12.5
      - key: AEGISLAB_ENV
        value: production
      - key: AEGISLAB_AUTO_MIGRATE
        value: "true"
      - key: DATABASE_POOLER_MODE
        value: transaction
      - key: DATABASE_SSLMODE
        value: require
      - key: DATABASE_URL
        sync: false
      - key: AEGISLAB_PUBLIC_ORIGIN
        sync: false
      - key: AEGISLAB_SIGNING_KEY
        sync: false
