[project]
name = "aegislab"
version = "0.1.0"
description = "Local infrastructure prototype for adversarial AI safety evaluation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "jinja2",
    "psycopg[binary]",
    "python-dotenv",
    "uvicorn",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires the configured Supabase PostgreSQL database"]

[tool.ruff]
extend-exclude = [".cache", ".venv", "local-data"]
target-version = "py312"
line-length = 100

[dependency-groups]
dev = [
    "httpx",
    "pytest",
    "ruff",
]
